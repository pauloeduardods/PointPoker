# Local development only needs `db` (see `mise run dev`).
# `docker compose --profile app up --build` runs the full stack at http://localhost:${FRONTEND_PORT:-8000}.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-pointpoker}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pointpoker}
      POSTGRES_DB: ${DB_NAME:-pointpoker}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pointpoker} -d ${DB_NAME:-pointpoker}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    profiles: ["app"]
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-pointpoker}
      DB_PASSWORD: ${DB_PASSWORD:-pointpoker}
      DB_NAME: ${DB_NAME:-pointpoker}
      DB_SSLMODE: disable
      API_PORT: 8080
      GIN_MODE: release
    depends_on:
      db:
        condition: service_healthy

  frontend:
    profiles: ["app"]
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8000}:80"
    depends_on:
      - backend

volumes:
  pgdata:
